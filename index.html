<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance Beats Sync - Waveform Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl p-6 shadow-2xl my-auto border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center text-amber-400 mb-6">🕺 Trainer Beats Sync</h1>

    <!-- PASO 1: CARGAR ARCHIVO -->
    <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700">
      <label class="block text-sm font-medium mb-2 text-slate-300">1. Selecciona tu MP3 / WAV</label>
      <input type="file" id="audioFile" accept="audio/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-400 font-semibold cursor-pointer">
    </div>

    <!-- PASO 2: ANALIZAR Y PROCESAR ONDA -->
    <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-4">
      <h2 class="text-sm font-medium text-slate-300">2. Análisis Digital de Onda</h2>
      
      <button id="analyzeWaveBtn" disabled class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 font-bold rounded text-sm transition shadow-md flex items-center justify-center space-x-2">
        <span>🔍 ESCANEAR RITMO Y ONDA DE AUDIO</span>
      </button>

      <!-- Estado / Progress -->
      <p id="analysisStatus" class="text-xs text-center text-slate-400 min-h-[1rem]">Carga una canción para escanear.</p>

      <!-- Resultados detectados automáticamente -->
      <div class="grid grid-cols-2 gap-4 pt-2">
        <div>
          <label class="text-xs text-slate-400 block mb-1">BPM Detectado</label>
          <input type="number" id="bpmInput" value="120" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-xl font-bold text-amber-400 focus:outline-none text-center">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Primer Golpe (Segundos)</label>
          <input type="number" id="offsetInput" value="0.00" step="0.01" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-xl font-bold text-indigo-400 focus:outline-none text-center">
        </div>
      </div>

      <!-- Controles de Prueba -->
      <div class="grid grid-cols-3 gap-2 pt-2">
        <button id="previewPlayBtn" disabled class="py-2 px-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-bold rounded text-xs transition">
          ▶️ Escuchar
        </button>
        <button id="previewPauseBtn" disabled class="py-2 px-3 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 font-bold rounded text-xs transition">
          ⏸️ Pausar
        </button>
        <button id="resetBtn" disabled class="py-2 px-3 bg-rose-700 hover:bg-rose-600 disabled:opacity-50 font-bold rounded text-xs transition">
          🔄 Reiniciar
        </button>
      </div>

      <div class="flex justify-between items-center bg-slate-800 p-2 rounded border border-slate-700">
        <span class="text-xs text-slate-400">Tiempo actual:</span>
        <span id="currentTimeDisplay" class="text-sm font-mono text-amber-400 font-bold">00:00</span>
      </div>
    </div>

    <!-- PASO 3: BAILAR -->
    <div class="mb-6 space-y-3">
      <audio id="audioPlayer" class="hidden"></audio>
      
      <div class="grid grid-cols-3 gap-2">
        <button id="playBtn" disabled class="col-span-1 py-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          💃 ¡BAILAR!
        </button>
        <button id="pauseBtn" disabled class="col-span-1 py-4 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          ⏸️ PAUSAR
        </button>
        <button id="mainResetBtn" disabled class="col-span-1 py-4 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          🔄 REINICIAR
        </button>
      </div>
    </div>

    <!-- MONITOREO DE COMPASES EN TIEMPO REAL -->
    <div class="bg-slate-950 p-6 rounded-xl text-center border border-slate-800">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="bg-slate-900 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">COMPÁS (1 al 8)</span>
          <span id="barDisplay" class="text-5xl font-black text-amber-400">1</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">TIEMPO (1 al 4)</span>
          <span id="beatDisplay" class="text-5xl font-black text-emerald-400">1</span>
        </div>
      </div>

      <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-lg">
        <span class="text-xs text-amber-400 font-bold block mb-1">PRÓXIMA FIGURA (AVISO EN COMPÁS 7):</span>
        <span id="nextStepDisplay" class="text-xl font-extrabold text-white">Carga tu canción para comenzar...</span>
      </div>
    </div>
  </div>

  <script>
    // Catálogo con 100 figuras de baile
    const danceSteps = Array.from({ length: 100 }, (_, i) => {
      const bases = ["Setenta", "Enchufla", "Vacílala", "Sombrero", "Dile que no", "Paso Cruzado", "Vuelta de la Mujer", "Vuelta del Hombre", "El Candado", "Mariposa", "Paso Cumbia", "Ocho Doble", "Pivote", "Caminada", "Giro Combinado"];
      const variaciones = ["Simple", "Doble", "con Escape", "Complicado", "con Enganche", "Urbano", "Especial", "Frenado", "con Giro"];
      return `${bases[i % bases.length]} ${variaciones[i % variaciones.length]}`;
    });

    let rawAudioBuffer = null;
    let bpm = 120;
    let firstBeatOffset = 0;
    let lastAnnouncedBar = -1;

    const audioPlayer = document.getElementById('audioPlayer');
    const audioFile = document.getElementById('audioFile');
    const analyzeWaveBtn = document.getElementById('analyzeWaveBtn');
    const analysisStatus = document.getElementById('analysisStatus');
    
    const previewPlayBtn = document.getElementById('previewPlayBtn');
    const previewPauseBtn = document.getElementById('previewPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const mainResetBtn = document.getElementById('mainResetBtn');
    
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const bpmInput = document.getElementById('bpmInput');
    const offsetInput = document.getElementById('offsetInput');
    const barDisplay = document.getElementById('barDisplay');
    const beatDisplay = document.getElementById('beatDisplay');
    const nextStepDisplay = document.getElementById('nextStepDisplay');

    // 1. Cargar el archivo y decodificar matriz de audio
    audioFile.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        audioPlayer.src = URL.createObjectURL(file);
        analysisStatus.textContent = "Cargando archivo en memoria...";
        
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        rawAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        analyzeWaveBtn.disabled = false;
        [previewPlayBtn, previewPauseBtn, resetBtn, playBtn, pauseBtn, mainResetBtn].forEach(b => b.disabled = false);
        
        analysisStatus.textContent = "Audio decodificado listo para escanear.";
        resetSongState();
      }
    });

    // 2. MOTOR DE ANÁLISIS DIGITAL DE ONDA
    analyzeWaveBtn.addEventListener('click', async () => {
      if (!rawAudioBuffer) return;

      analysisStatus.textContent = "⏳ Analizando frecuencias y picos de onda...";
      analyzeWaveBtn.disabled = true;

      setTimeout(async () => {
        try {
          const result = await detectBpmAndOffset(rawAudioBuffer);
          bpm = result.bpm;
          firstBeatOffset = result.offset;

          bpmInput.value = bpm.toFixed(1);
          offsetInput.value = firstBeatOffset.toFixed(2);

          analysisStatus.textContent = `⚡ Análisis Completo: ${bpm.toFixed(1)} BPM | Primer golpe en ${firstBeatOffset.toFixed(2)}s`;
          analysisStatus.className = "text-xs text-center text-emerald-400 font-bold min-h-[1rem]";
        } catch (err) {
          analysisStatus.textContent = "Error al escanear la onda.";
        } finally {
          analyzeWaveBtn.disabled = false;
        }
      }, 100);
    });

    // Algoritmo DSP (Digital Signal Processing)
    async function detectBpmAndOffset(buffer) {
      // Tomar los primeros 45 segundos para el escaneo
      const duration = Math.min(buffer.duration, 45);
      const sampleRate = buffer.sampleRate;
      const offlineCtx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);

      const source = offlineCtx.createBufferSource();
      source.buffer = buffer;

      // Filtro pasa-bajos para aislar bombo / percusión (graves)
      const filter = offlineCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 150;

      source.connect(filter);
      filter.connect(offlineCtx.destination);
      source.start(0);

      const renderedBuffer = await offlineCtx.startRendering();
      const data = renderedBuffer.getChannelData(0);

      // Calcular energía por bloques de 10ms
      const step = Math.floor(sampleRate * 0.01);
      const energies = [];
      for (let i = 0; i < data.length; i += step) {
        let sum = 0;
        for (let j = 0; j < step && (i + j) < data.length; j++) {
          sum += data[i + j] * data[i + j];
        }
        energies.push(Math.sqrt(sum / step));
      }

      // Encontrar picos que superen el umbral promedio
      const avgEnergy = energies.reduce((a, b) => a + b, 0) / energies.length;
      const peaks = [];
      for (let i = 1; i < energies.length - 1; i++) {
        if (energies[i] > avgEnergy * 1.3 && energies[i] > energies[i - 1] && energies[i] > energies[i + 1]) {
          peaks.push(i * 0.01); // Tiempo en segundos
        }
      }

      // Calcular intervalos entre picos para estimar BPM (Rango 80 - 180 BPM)
      const intervals = [];
      for (let i = 1; i < peaks.length; i++) {
        const diff = peaks[i] - peaks[i - 1];
        const tempBpm = 60 / diff;
        if (tempBpm >= 80 && tempBpm <= 180) {
          intervals.push(tempBpm);
        }
      }

      // Promedio ponderado de los BPMs detectados
      intervals.sort((a, b) => a - b);
      const medianBpm = intervals.length > 0 ? intervals[Math.floor(intervals.length / 2)] : 120;
      
      // El primer pico representativo es el offset inicial
      const offset = peaks.length > 0 ? peaks[0] : 0;

      return { bpm: medianBpm, offset: offset };
    }

    // Manual Overrides
    bpmInput.addEventListener('input', () => bpm = parseFloat(bpmInput.value) || 120);
    offsetInput.addEventListener('input', () => firstBeatOffset = parseFloat(offsetInput.value) || 0);

    // Reproducción
    function playAudio() {
      if (audioPlayer.src) {
        audioPlayer.play();
        requestAnimationFrame(syncDance);
      }
    }

    function pauseAudio() {
      audioPlayer.pause();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function resetSongState() {
      pauseAudio();
      audioPlayer.currentTime = 0;
      barDisplay.textContent = "1";
      beatDisplay.textContent = "1";
      lastAnnouncedBar = -1;
      updateTimeDisplay();
      nextStepDisplay.textContent = "Listo para iniciar...";
    }

    previewPlayBtn.addEventListener('click', playAudio);
    playBtn.addEventListener('click', playAudio);
    previewPauseBtn.addEventListener('click', pauseAudio);
    pauseBtn.addEventListener('click', pauseAudio);
    resetBtn.addEventListener('click', resetSongState);
    mainResetBtn.addEventListener('click', resetSongState);

    function updateTimeDisplay() {
      const mins = Math.floor(audioPlayer.currentTime / 60);
      const secs = Math.floor(audioPlayer.currentTime % 60);
      currentTimeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Sincronización precisa en tiempo real
    function syncDance() {
      if (!audioPlayer.paused && !audioPlayer.ended) {
        const currentTime = audioPlayer.currentTime;
        
        if (currentTime >= firstBeatOffset) {
          const secondsPerBeat = 60 / bpm;
          const totalBeats = Math.floor((currentTime - firstBeatOffset) / secondsPerBeat);
          
          const currentBeat = (totalBeats % 4) + 1;
          const totalBars = Math.floor(totalBeats / 4);
          const currentBar = (totalBars % 8) + 1;

          beatDisplay.textContent = currentBeat;
          barDisplay.textContent = currentBar;

          if (currentBar === 7 && lastAnnouncedBar !== totalBars) {
            lastAnnouncedBar = totalBars;
            announceNextStep();
          }
        }
        updateTimeDisplay();
        requestAnimationFrame(syncDance);
      }
    }

    // Voz
    function announceNextStep() {
      const randomStep = danceSteps[Math.floor(Math.random() * danceSteps.length)];
      nextStepDisplay.textContent = randomStep;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`Prepara: ${randomStep}`);
        utterance.lang = 'es-ES';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
