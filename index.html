<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dance Beats Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-xl w-full bg-slate-800 rounded-xl p-6 shadow-2xl my-auto border border-slate-700">
    <h1 class="text-3xl font-extrabold text-center text-amber-400 mb-6">🕺 Trainer Beats Sync</h1>

    <!-- PASO 1: CARGAR ARCHIVO -->
    <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700">
      <label class="block text-sm font-medium mb-2 text-slate-300">1. Selecciona tu MP3 / WAV</label>
      <input type="file" id="audioFile" accept="audio/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-400 font-semibold cursor-pointer">
    </div>

    <!-- PASO 2: PROCESAR / CALIBRAR (REPRODUCCIÓN Y TAP) -->
    <div class="mb-6 bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-4">
      <h2 class="text-sm font-medium text-slate-300">2. Procesar y Cuadrar Tiempos</h2>
      
      <!-- Controles de Prueba / Calibración -->
      <div class="grid grid-cols-3 gap-2">
        <button id="previewPlayBtn" disabled class="py-2 px-3 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-bold rounded text-xs transition">
          ▶️ Escuchar
        </button>
        <button id="previewPauseBtn" disabled class="py-2 px-3 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 font-bold rounded text-xs transition">
          ⏸️ Pausar
        </button>
        <button id="resetBtn" disabled class="py-2 px-3 bg-rose-700 hover:bg-rose-600 disabled:opacity-50 font-bold rounded text-xs transition">
          🔄 Reiniciar
        </button>
      </div>

      <div class="flex justify-between items-center bg-slate-800 p-2 rounded border border-slate-700">
        <span class="text-xs text-slate-400">Tiempo actual:</span>
        <span id="currentTimeDisplay" class="text-sm font-mono text-amber-400 font-bold">00:00</span>
      </div>

      <!-- Ajuste de BPM y Tap Tempo -->
      <div class="grid grid-cols-2 gap-4 pt-2">
        <div>
          <label class="text-xs text-slate-400 block mb-1">BPM Exacto</label>
          <input type="number" id="bpmInput" value="120" step="0.5" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-xl font-bold text-amber-400 focus:outline-none text-center">
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Tap Tempo</label>
          <button id="tapBtn" disabled class="w-full h-11 bg-slate-700 hover:bg-slate-600 active:bg-amber-500 active:text-slate-900 font-bold rounded transition text-sm">
            🥁 Tap Tempo
          </button>
        </div>
      </div>

      <!-- Botón Marcar Tiempo 1 -->
      <div>
        <button id="setOffsetBtn" disabled class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 font-bold rounded text-sm transition">
          📍 Marcar "Tiempo 1" (Golpe Inicial)
        </button>
        <p id="offsetStatus" class="text-xs text-center mt-2 text-slate-400 h-4">
          Tiempo 1 no fijado (0.00s)
        </p>
      </div>
    </div>

    <!-- PASO 3: BAILAR -->
    <div class="mb-6 space-y-3">
      <audio id="audioPlayer" class="hidden"></audio>
      
      <div class="grid grid-cols-3 gap-2">
        <button id="playBtn" disabled class="col-span-1 py-4 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          💃 ¡BAILAR!
        </button>
        <button id="pauseBtn" disabled class="col-span-1 py-4 bg-amber-600 hover:bg-amber-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          ⏸️ PAUSAR
        </button>
        <button id="mainResetBtn" disabled class="col-span-1 py-4 bg-rose-600 hover:bg-rose-500 disabled:opacity-50 font-black text-lg rounded-lg transition shadow-lg">
          🔄 REINICIAR
        </button>
      </div>
    </div>

    <!-- MONITOREO DE COMPASES EN TIEMPO REAL -->
    <div class="bg-slate-950 p-6 rounded-xl text-center border border-slate-800">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="bg-slate-900 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">COMPÁS (1 al 8)</span>
          <span id="barDisplay" class="text-5xl font-black text-amber-400">1</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg">
          <span class="text-xs text-slate-400 block">TIEMPO (1 al 4)</span>
          <span id="beatDisplay" class="text-5xl font-black text-emerald-400">1</span>
        </div>
      </div>

      <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-lg">
        <span class="text-xs text-amber-400 font-bold block mb-1">PRÓXIMA FIGURA (AVISO EN COMPÁS 7):</span>
        <span id="nextStepDisplay" class="text-xl font-extrabold text-white">Carga tu canción para comenzar...</span>
      </div>
    </div>
  </div>

  <script>
    // Catálogo con 100 figuras de baile
    const danceSteps = Array.from({ length: 100 }, (_, i) => {
      const bases = ["Setenta", "Enchufla", "Vacílala", "Sombrero", "Dile que no", "Paso Cruzado", "Vuelta de la Mujer", "Vuelta del Hombre", "El Candado", "Mariposa", "Paso Cumbia", "Ocho Doble", "Pivote", "Caminada", "Giro Combinado"];
      const variaciones = ["Simple", "Doble", "con Escape", "Complicado", "con Enganche", "Urbano", "Especial", "Frenado", "con Giro"];
      return `${bases[i % bases.length]} ${variaciones[i % variaciones.length]}`;
    });

    let bpm = 120;
    let firstBeatOffset = 0;
    let tapTimes = [];
    let lastAnnouncedBar = -1;

    const audioPlayer = document.getElementById('audioPlayer');
    const audioFile = document.getElementById('audioFile');
    
    // Botones de control
    const previewPlayBtn = document.getElementById('previewPlayBtn');
    const previewPauseBtn = document.getElementById('previewPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const mainResetBtn = document.getElementById('mainResetBtn');
    
    const currentTimeDisplay = document.getElementById('currentTimeDisplay');
    const bpmInput = document.getElementById('bpmInput');
    const tapBtn = document.getElementById('tapBtn');
    const setOffsetBtn = document.getElementById('setOffsetBtn');
    const offsetStatus = document.getElementById('offsetStatus');
    const barDisplay = document.getElementById('barDisplay');
    const beatDisplay = document.getElementById('beatDisplay');
    const nextStepDisplay = document.getElementById('nextStepDisplay');

    // 1. Cargar archivo de audio
    audioFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audioPlayer.src = URL.createObjectURL(file);
        
        // Habilitar todos los botones
        [previewPlayBtn, previewPauseBtn, resetBtn, playBtn, pauseBtn, mainResetBtn, tapBtn, setOffsetBtn].forEach(b => b.disabled = false);
        
        resetSongState();
      }
    });

    // Reproducción y Pausa
    function playAudio() {
      if (audioPlayer.src) {
        audioPlayer.play();
        requestAnimationFrame(syncDance);
      }
    }

    function pauseAudio() {
      audioPlayer.pause();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function resetSongState() {
      pauseAudio();
      audioPlayer.currentTime = 0;
      barDisplay.textContent = "1";
      beatDisplay.textContent = "1";
      lastAnnouncedBar = -1;
      updateTimeDisplay();
      nextStepDisplay.textContent = "Listo para iniciar...";
    }

    // Eventos de los botones de reproducción
    previewPlayBtn.addEventListener('click', playAudio);
    playBtn.addEventListener('click', playAudio);

    previewPauseBtn.addEventListener('click', pauseAudio);
    pauseBtn.addEventListener('click', pauseAudio);

    resetBtn.addEventListener('click', resetSongState);
    mainResetBtn.addEventListener('click', resetSongState);

    function updateTimeDisplay() {
      const mins = Math.floor(audioPlayer.currentTime / 60);
      const secs = Math.floor(audioPlayer.currentTime % 60);
      currentTimeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Tap Tempo
    tapBtn.addEventListener('click', () => {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();

      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i-1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
        bpm = Math.round(60000 / avgInterval);
        bpmInput.value = bpm;
      }
    });

    bpmInput.addEventListener('input', () => {
      bpm = parseFloat(bpmInput.value) || 120;
    });

    // Fijar "Tiempo 1"
    setOffsetBtn.addEventListener('click', () => {
      firstBeatOffset = audioPlayer.currentTime;
      offsetStatus.textContent = `✓ Tiempo 1 fijado en el segundo ${firstBeatOffset.toFixed(2)}s`;
      offsetStatus.className = "text-xs text-center mt-2 text-emerald-400 font-bold h-4";
    });

    // Algoritmo de Sincronización
    function syncDance() {
      if (!audioPlayer.paused && !audioPlayer.ended) {
        const currentTime = audioPlayer.currentTime;
        
        if (currentTime >= firstBeatOffset) {
          const secondsPerBeat = 60 / bpm;
          const totalBeats = Math.floor((currentTime - firstBeatOffset) / secondsPerBeat);
          
          const currentBeat = (totalBeats % 4) + 1;
          const totalBars = Math.floor(totalBeats / 4);
          const currentBar = (totalBars % 8) + 1;

          beatDisplay.textContent = currentBeat;
          barDisplay.textContent = currentBar;

          // Lanzar voz en el Compás 7 (Anticipación de 2 compases)
          if (currentBar === 7 && lastAnnouncedBar !== totalBars) {
            lastAnnouncedBar = totalBars;
            announceNextStep();
          }
        }
        updateTimeDisplay();
        requestAnimationFrame(syncDance);
      }
    }

    // Síntesis de Voz
    function announceNextStep() {
      const randomStep = danceSteps[Math.floor(Math.random() * danceSteps.length)];
      nextStepDisplay.textContent = randomStep;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(`Prepara: ${randomStep}`);
        utterance.lang = 'es-ES';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
